<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChillSPot - Your Space</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6f8;
  color: #20232a;
}
header {
  background: white;
  padding: 16px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  border-bottom: 1px solid #eee;
  z-index: 5;
}
.logo { font-size: 25px; font-weight: bold; color: #6554db; }
nav { display: flex; gap: 18px; }
nav button {
  border: 0;
  background: none;
  font-size: 15px;
  cursor: pointer;
  color: #555;
}
main {
  max-width: 650px;
  margin: 25px auto;
  padding: 0 15px;
}
.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 2px 10px #00000008;
}
h2 { margin-top: 0; }
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  resize: vertical;
  font: inherit;
}
input {
  max-width: 100%;
  margin-top: 10px;
}
.primary {
  background: #6554db;
  color: white;
  border: 0;
  padding: 11px 18px;
  border-radius: 9px;
  cursor: pointer;
  margin-top: 10px;
}
.post { line-height: 1.5; }
.post img, .post video {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}
.muted { color: #888; font-size: 13px; }
.actions {
  display: flex;
  gap: 20px;
  margin-top: 12px;
}
.actions button {
  border: 0;
  background: none;
  cursor: pointer;
  font-size: 15px;
}
#reels { display: none; }
.reel video {
  width: 100%;
  max-height: 500px;
  background: #111;
  border-radius: 12px;
}
footer {
  text-align: center;
  padding: 25px;
  color: #888;
}
</style>
</head>
<body>

<header>
  <div class="logo">ChillSPot ✨</div>
  <nav>
    <button onclick="showPage('home')">🏠 Home</button>
    <button onclick="showPage('reels')">🎬 Reels</button>
  </nav>
</header>

<main>
  <section id="home">
    <div class="card">
      <h2>Welcome to ChillSPot 👋</h2>
      <p class="muted">Your space. Your people. Your vibe.</p>
    </div>

    <div class="card">
      <h3>Create a post ✏️</h3>
      <textarea id="postText" rows="3"
        placeholder="What's on your mind?"></textarea>
      <br>
      <input type="file" id="postImage" accept="image/*">
      <br>
      <button class="primary" onclick="createPost()">Share post</button>
    </div>

    <div id="feed"></div>
  </section>

  <section id="reels">
    <div class="card">
      <h2>🎬 ChillSPot Reels</h2>
      <p class="muted">Watch and share short videos.</p>
      <input type="file" id="reelFile" accept="video/*">
      <br>
      <button class="primary" onclick="addReel()">Upload reel</button>
    </div>
    <div id="reelFeed"></div>
  </section>
</main>

<footer>Made with ❤️ by ChillSPot</footer>

<script>
function showPage(page) {
  document.getElementById('home').style.display =
    page === 'home' ? 'block' : 'none';
  document.getElementById('reels').style.display =
    page === 'reels' ? 'block' : 'none';
}

function createPost() {
  const text = document.getElementById('postText').value.trim();
  const file = document.getElementById('postImage').files[0];

  if (!text && !file) {
    alert('Write something or choose a photo!');
    return;
  }

  const post = document.createElement('div');
  post.className = 'card post';

  const title = document.createElement('strong');
  title.textContent = 'ChillSPot Member';
  post.appendChild(title);

  const content = document.createElement('p');
  content.textContent = text;
  post.appendChild(content);

  if (file) {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    post.appendChild(img);
  }

  const actions = document.createElement('div');
  actions.className = 'actions';
  let likes = 0;

  const like = document.createElement('button');
  like.textContent = '♡ Like (0)';
  like.onclick = () => {
    likes++;
    like.textContent = '♥ Like (' + likes + ')';
  };

  const comment = document.createElement('button');
  comment.textContent = '💬 Comment';
  comment.onclick = () => {
    const reply = prompt('Write a comment:');
    if (reply) {
      const c = document.createElement('p');
      c.textContent = '💬 ' + reply;
      post.appendChild(c);
    }
  };

  actions.append(like, comment);
  post.appendChild(actions);
  document.getElementById('feed').prepend(post);

  document.getElementById('postText').value = '';
  document.getElementById('postImage').value = '';
}

function addReel() {
  const file = document.getElementById('reelFile').files[0];
  if (!file) {
    alert('Choose a video first!');
    return;
  }

  const card = document.createElement('div');
  card.className = 'card reel';

  const video = document.createElement('video');
  video.src = URL.createObjectURL(file);
  video.controls = true;
  video.playsInline = true;

  const title = document.createElement('p');
  title.textContent = '🎬 ChillSPot Reel';

  card.append(video, title);
  document.getElementById('reelFeed').prepend(card);
  document.getElementById('reelFile').value = '';
}
</script>
</body>
  </html>
