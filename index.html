
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChillSPot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --black: #151515;
  --grey: #777;
  --light: #f3f3f3;
  --orange: #f28c28;
  --white: #fff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--light);
  color: var(--black);
  font-family: Arial, sans-serif;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
header {
  background: var(--black);
  color: white;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { font-size: 25px; font-weight: 800; }
.logo span { color: var(--orange); }
main { max-width: 650px; margin: 28px auto; padding: 0 15px; }
.card {
  background: white;
  padding: 24px;
  border-radius: 5px;
  margin-bottom: 18px;
}
h2 { margin-top: 0; }
input, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 4px;
  margin: 7px 0 13px;
  background: white;
}
textarea { resize: vertical; min-height: 75px; }
button.primary {
  background: var(--orange);
  color: var(--black);
  border: 0;
  padding: 13px 18px;
  border-radius: 4px;
  font-weight: bold;
  width: 100%;
}
button.secondary {
  background: var(--black);
  color: white;
  border: 0;
  padding: 10px 14px;
  border-radius: 4px;
}
.switch {
  text-align: center;
  color: var(--grey);
  margin-top: 18px;
  font-size: 14px;
}
.switch button {
  border: 0;
  background: none;
  color: var(--orange);
  font-weight: bold;
}
.hidden { display: none !important; }
#message { margin: 12px 0; font-size: 14px; }
.post { background: white; margin-bottom: 18px; border-radius: 5px; overflow: hidden; }
.post-info { padding: 15px; }
.post img { width: 100%; display: block; object-fit: cover; }
.muted { color: var(--grey); font-size: 13px; }
.post-caption { margin-top: 10px; }
.top-actions { display: flex; gap: 10px; align-items: center; }
#file { margin: 12px 0; }
footer { text-align: center; color: var(--grey); padding: 25px; font-size: 12px; }
</style>
</head>

<body>

<header>
  <div class="logo">ChillSPot<span>.</span></div>
  <div class="top-actions">
    <span id="userLabel" class="muted" style="color:white"></span>
    <button id="logoutBtn" class="secondary hidden">Log out</button>
  </div>
</header>

<main>

  <section id="authArea" class="card">
    <div id="loginForm">
      <h2>Welcome back.</h2>
      <p class="muted">Log in to your ChillSPot account.</p>
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="Your email">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Your password">
      <button class="primary" id="loginBtn">LOG IN</button>
      <div class="switch">
        New to ChillSPot?
        <button id="showSignup">Create account</button>
      </div>
    </div>

    <div id="signupForm" class="hidden">
      <h2>Create your account.</h2>
      <p class="muted">Join the ChillSPot community.</p>
      <label>Full name</label>
      <input id="fullName" placeholder="Your name">
      <label>Username</label>
      <input id="username" placeholder="Choose a username">
      <label>Email</label>
      <input id="signupEmail" type="email" placeholder="Your email">
      <label>Password</label>
      <input id="signupPassword" type="password" minlength="6" placeholder="At least 6 characters">
      <button class="primary" id="signupBtn">CREATE ACCOUNT</button>
      <div class="switch">
        Already have an account?
        <button id="showLogin">Log in</button>
      </div>
    </div>
    <div id="message"></div>
  </section>

  <section id="appArea" class="hidden">
    <div class="card">
      <h2>Share a picture.</h2>
      <p class="muted">Share a moment with the ChillSPot community.</p>
      <label>Choose a picture</label>
      <input id="file" type="file" accept="image/*">
      <label>Caption</label>
      <textarea id="caption" maxlength="1000" placeholder="Write something..."></textarea>
      <button class="primary" id="postBtn">PUBLISH POST</button>
      <div id="postMessage"></div>
    </div>

    <h2>Your feed</h2>
    <div id="feed"></div>
  </section>

</main>

<footer>CHILLSPOT © 2026</footer>

<script>
const SUPABASE_URL = "https://ccbmsrehsufakvkzfwpc.supabase.co";
const SUPABASE_KEY = "sb_publishable_rWGMbKhFrMp0HZtp6hMQGQ_cjlhgqXX";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

function message(text, isError = false) {
  $("message").textContent = text;
  $("message").style.color = isError ? "#c0392b" : "#333";
}

function postMessage(text, isError = false) {
  $("postMessage").textContent = text;
  $("postMessage").style.color = isError ? "#c0392b" : "#333";
}

$("showSignup").onclick = () => {
  $("loginForm").classList.add("hidden");
  $("signupForm").classList.remove("hidden");
  message("");
};

$("showLogin").onclick = () => {
  $("signupForm").classList.add("hidden");
  $("loginForm").classList.remove("hidden");
  message("");
};

async function showApp(user) {
  $("authArea").classList.add("hidden");
  $("appArea").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  $("userLabel").textContent = user.email || "";
  await loadFeed();
}

async function showLoginScreen() {
  $("authArea").classList.remove("hidden");
  $("appArea").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
  $("userLabel").textContent = "";
}

$("signupBtn").onclick = async () => {
  const name = $("fullName").value.trim();
  const username = $("username").value.trim().toLowerCase();
  const email = $("signupEmail").value.trim();
  const password = $("signupPassword").value;

  if (!name || !username || !email || !password) {
    return message("Please complete all fields.", true);
  }

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    return message("Username must be 3–20 characters: letters, numbers or underscores.", true);
  }

  if (password.length < 6) {
    return message("Password must have at least 6 characters.", true);
  }

  $("signupBtn").disabled = true;
  message("Creating your account...");

  try {
    const { data: existing, error: checkError } = await db
      .from("profiles")
      .select("id")
      .eq("username", username)
      .maybeSingle();

    if (checkError) throw checkError;
    if (existing) throw new Error("That username is already taken.");

    const { data, error } = await db.auth.signUp({
      email,
      password
    });

    if (error) throw error;
    if (!data.user) throw new Error("Account creation did not complete.");

    if (!data.session) {
      message("Account created, but Supabase did not start a session. Check the email confirmation setting and try logging in.", true);
      return;
    }

    const { error: profileError } = await db.from("profiles").insert({
      id: data.user.id,
      username,
      display_name: name
    });

    if (profileError) throw profileError;

    message("Welcome to ChillSPot!");
    await showApp(data.user);

  } catch (error) {
    message(error.message, true);
  } finally {
    $("signupBtn").disabled = false;
  }
};

$("loginBtn").onclick = async () => {
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if (!email || !password) return message("Enter your email and password.", true);

  $("loginBtn").disabled = true;
  message("Logging in...");

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;
    message("");
    await showApp(data.user);

  } catch (error) {
    message(error.message, true);
  } finally {
    $("loginBtn").disabled = false;
  }
};

$("logoutBtn").onclick = async () => {
  await db.auth.signOut();
  await showLoginScreen();
  message("You have logged out.");
};

$("postBtn").onclick = async () => {
  const file = $("file").files[0];
  const caption = $("caption").value.trim();

  if (!file) return postMessage("Please choose a picture first.", true);
  if (!file.type.startsWith("image/")) return postMessage("Please choose an image file.", true);
  if (file.size > 5 * 1024 * 1024) return postMessage("Please choose an image smaller than 5 MB.", true);

  $("postBtn").disabled = true;
  postMessage("Uploading your picture...");

  try {
    const { data: authData, error: authError } = await db.auth.getUser();
    if (authError) throw authError;
    const user = authData.user;
    if (!user) throw new Error("Please log in again.");

    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = user.id + "/" + Date.now() + "-" + safeName;

    const { error: uploadError } = await db.storage
      .from("post-images")
      .upload(path, file, { upsert: false });

    if (uploadError) throw uploadError;

    const { data: imageData } = db.storage
      .from("post-images")
      .getPublicUrl(path);

    const { error: insertError } = await db.from("posts").insert({
      user_id: user.id,
      content: caption,
      image_url: imageData.publicUrl
    });

    if (insertError) throw insertError;

    $("file").value = "";
    $("caption").value = "";
    postMessage("Your picture has been published!");
    await loadFeed();

  } catch (error) {
    postMessage(error.message, true);
  } finally {
    $("postBtn").disabled = false;
  }
};

async function loadFeed() {
  $("feed").textContent = "Loading posts...";

  try {
    const { data: posts, error } = await db
      .from("posts")
      .select("id, user_id, content, image_url, created_at")
      .order("created_at", { ascending: false });

    if (error) throw error;

    if (!posts || posts.length === 0) {
      $("feed").textContent = "No posts yet. Be the first to share a picture!";
      return;
    }

    const userIds = [...new Set(posts.map(p => p.user_id))];

    const { data: profiles, error: profileError } = await db
      .from("profiles")
      .select("id, username, display_name")
      .in("id", userIds);

    if (profileError) throw profileError;

    const profileMap = Object.fromEntries(
      (profiles || []).map(p => [p.id, p])
    );

    $("feed").innerHTML = "";

    posts.forEach(post => {
      const profile = profileMap[post.user_id] || {};
      const article = document.createElement("article");
      article.className = "post";

      const info = document.createElement("div");
      info.className = "post-info";

      const author = document.createElement("strong");
      author.textContent = profile.display_name || profile.username || "ChillSPot user";

      const handle = document.createElement("div");
      handle.className = "muted";
      handle.textContent = profile.username ? "@" + profile.username : "";

      const picture = document.createElement("img");
      picture.src = post.image_url;
      picture.alt = "Community picture";
      picture.loading = "lazy";

      const caption = document.createElement("div");
      caption.className = "post-caption";
      caption.textContent = post.content || "";

      const date = document.createElement("div");
      date.className = "muted";
      date.style.marginTop = "10px";
      date.textContent = post.created_at
        ? new Date(post.created_at).toLocaleString()
        : "";

      info.append(author, handle, caption, date);
      article.append(info, picture);
      $("feed").appendChild(article);
    });

  } catch (error) {
    $("feed").textContent = "Could not load posts: " + error.message;
  }
}

async function start() {
  const { data } = await db.auth.getSession();
  if (data.session) {
    await showApp(data.session.user);
  } else {
    await showLoginScreen();
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT" || !session) {
    showLoginScreen();
  }
});

start();
</script>
</body>
</html>
