
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChillSPot</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #111; color: #fff;
      font-family: Arial, sans-serif;
    }
    .wrap { max-width: 600px; margin: auto; padding: 20px; }
    h1 { text-align: center; color: #ff8a00; }
    .panel {
      background: #202020; padding: 20px; border-radius: 14px;
      margin: 16px 0;
    }
    input, textarea, button {
      width: 100%; padding: 13px; margin: 8px 0;
      border: 0; border-radius: 8px; font-size: 16px;
    }
    input, textarea { background: #333; color: white; }
    button {
      background: #ff8a00; color: #111; font-weight: bold;
      cursor: pointer;
    }
    button.secondary { background: #444; color: white; }
    .muted { color: #aaa; text-align: center; font-size: 14px; }
    .post { border-bottom: 1px solid #444; padding: 15px 0; }
    .post img { width: 100%; border-radius: 10px; margin-top: 10px; }
    .hidden { display: none; }
    #status { color: #ffb45c; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ChillSPot</h1>
    <p class="muted">Your space. Your people. Your vibe.</p>

    <section id="authArea" class="panel">
      <div id="loginBox">
        <h2>Welcome back</h2>
        <input id="loginUsername" placeholder="Username" autocomplete="username">
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn">Log in</button>
        <p class="muted">New to ChillSPot?</p>
        <button class="secondary" id="showSignup">Create an account</button>
      </div>

      <div id="signupBox" class="hidden">
        <h2>Join ChillSPot</h2>
        <input id="newUsername" placeholder="Choose a username" autocomplete="username">
        <input id="newDisplayName" placeholder="Display name">
        <input id="newPassword" type="password" placeholder="Create a password (at least 6 characters)" autocomplete="new-password">
        <button id="signupBtn">Create account</button>
        <button class="secondary" id="showLogin">Back to login</button>
      </div>
      <p id="status"></p>
    </section>

    <section id="appArea" class="hidden">
      <div class="panel">
        <h2 id="welcome"></h2>
        <button class="secondary" id="logoutBtn">Log out</button>
      </div>

      <div class="panel">
        <h2>Create a post</h2>
        <textarea id="postText" placeholder="What's on your mind?"></textarea>
        <input id="postImage" type="file" accept="image/*">
        <button id="postBtn">Share post</button>
        <p id="postStatus" class="muted"></p>
      </div>

      <div class="panel">
        <h2>Community feed</h2>
        <div id="feed">Loading posts...</div>
      </div>
    </section>
  </div>

<script>
const SUPABASE_URL = "https://ccbmsrehsufakvkzfwpc.supabase.co";
const SUPABASE_KEY = "sb_publishable_rWGMbKhFrMp0HZtp6hMQGQ_cjlhgqXX";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let currentUser = null;
let currentProfile = null;

// Internal address: users only enter a username, never an email.
function usernameToEmail(username) {
  return username.trim().toLowerCase() + "@users.chillspot.invalid";
}

function cleanUsername(value) {
  return value.trim().toLowerCase();
}

function showStatus(message) {
  $("status").textContent = message;
}

function showLogin() {
  $("loginBox").classList.remove("hidden");
  $("signupBox").classList.add("hidden");
  showStatus("");
}

function showSignup() {
  $("loginBox").classList.add("hidden");
  $("signupBox").classList.remove("hidden");
  showStatus("");
}

$("showSignup").onclick = showSignup;
$("showLogin").onclick = showLogin;

async function loadProfile(user) {
  const { data, error } = await db
    .from("profiles")
    .select("id, username, display_name")
    .eq("id", user.id)
    .maybeSingle();

  if (error) throw error;
  return data;
}

async function enterApp(user) {
  currentUser = user;
  try {
    currentProfile = await loadProfile(user);
    if (!currentProfile) {
      showStatus("Your profile is missing. Please contact support.");
      return;
    }

    $("authArea").classList.add("hidden");
    $("appArea").classList.remove("hidden");
    $("welcome").textContent =
      "Welcome, " + (currentProfile.display_name || currentProfile.username) + "!";
    await loadFeed();
  } catch (error) {
    showStatus("Could not load your profile: " + error.message);
  }
}

$("signupBtn").onclick = async () => {
  const username = cleanUsername($("newUsername").value);
  const displayName = $("newDisplayName").value.trim();
  const password = $("newPassword").value;

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    showStatus("Username must be 3–20 characters: letters, numbers or underscores.");
    return;
  }
  if (password.length < 6) {
    showStatus("Your password must be at least 6 characters.");
    return;
  }

  $("signupBtn").disabled = true;
  showStatus("Creating your account...");

  try {
    const email = usernameToEmail(username);

    const { data, error } = await db.auth.signUp({
      email,
      password
    });
    if (error) throw error;

    if (!data.user) throw new Error("Account was not created.");

    if (!data.session) {
      showStatus("Account created, but no session was returned. Check that email confirmation is OFF in Supabase.");
      return;
    }

    const { error: profileError } = await db.from("profiles").insert({
      id: data.user.id,
      username,
      display_name: displayName || username
    });

    if (profileError) throw profileError;
    await enterApp(data.user);
  } catch (error) {
    showStatus(error.message);
  } finally {
    $("signupBtn").disabled = false;
  }
};

$("loginBtn").onclick = async () => {
  const username = cleanUsername($("loginUsername").value);
  const password = $("loginPassword").value;

  if (!username || !password) {
    showStatus("Enter your username and password.");
    return;
  }

  $("loginBtn").disabled = true;
  showStatus("Logging in...");

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email: usernameToEmail(username),
      password
    });
    if (error) throw error;
    await enterApp(data.user);
  } catch (error) {
    showStatus("Login failed: " + error.message);
  } finally {
    $("loginBtn").disabled = false;
  }
};

$("logoutBtn").onclick = async () => {
  await db.auth.signOut();
  currentUser = null;
  currentProfile = null;
  $("appArea").classList.add("hidden");
  $("authArea").classList.remove("hidden");
  showLogin();
};

async function loadFeed() {
  $("feed").textContent = "Loading posts...";
  const { data, error } = await db
    .from("posts")
    .select("id, user_id, content, image_url, created_at")
    .order("created_at", { ascending: false })
    .limit(30);

  if (error) {
    $("feed").textContent = "Could not load posts: " + error.message;
    return;
  }

  if (!data.length) {
    $("feed").textContent = "No posts yet. Be the first to share something!";
    return;
  }

  $("feed").innerHTML = "";
  for (const post of data) {
    const item = document.createElement("div");
    item.className = "post";

    const text = document.createElement("p");
    text.textContent = post.content || "";
    item.appendChild(text);

    if (post.image_url) {
      const img = document.createElement("img");
      img.src = post.image_url;
      img.alt = "Post image";
      item.appendChild(img);
    }

    const date = document.createElement("p");
    date.className = "muted";
    date.textContent = post.created_at
      ? new Date(post.created_at).toLocaleString()
      : "";
    item.appendChild(date);

    $("feed").appendChild(item);
  }
}

$("postBtn").onclick = async () => {
  const content = $("postText").value.trim();
  const file = $("postImage").files[0];
  $("postStatus").textContent = "";

  if (!content && !file) {
    $("postStatus").textContent = "Write something or choose a photo.";
    return;
  }
  if (file && file.size > 5 * 1024 * 1024) {
    $("postStatus").textContent = "Please choose an image smaller than 5 MB.";
    return;
  }

  $("postBtn").disabled = true;
  $("postStatus").textContent = "Sharing...";

  try {
    let imageUrl = null;

    if (file) {
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const path = currentUser.id + "/" + Date.now() + "_" + safeName;

      const { error: uploadError } = await db.storage
        .from("post-images")
        .upload(path, file);

      if (uploadError) throw uploadError;

      const { data: urlData } = db.storage
        .from("post-images")
        .getPublicUrl(path);

      imageUrl = urlData.publicUrl;
    }

    const { error } = await db.from("posts").insert({
      user_id: currentUser.id,
      content,
      image_url: imageUrl
    });

    if (error) throw error;

    $("postText").value = "";
    $("postImage").value = "";
    $("postStatus").textContent = "Post shared!";
    await loadFeed();
  } catch (error) {
    $("postStatus").textContent = "Could not share post: " + error.message;
  } finally {
    $("postBtn").disabled = false;
  }
};

async function start() {
  const { data, error } = await db.auth.getSession();
  if (error) {
    showStatus(error.message);
    return;
  }
  if (data.session) {
    await enterApp(data.session.user);
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") {
    currentUser = null;
    currentProfile = null;
    $("appArea").classList.add("hidden");
    $("authArea").classList.remove("hidden");
    showLogin();
  }
});

start();
</script>
</body>
</html>
