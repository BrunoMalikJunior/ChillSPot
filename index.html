
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChillSPot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --black:#151515;
  --grey:#777;
  --light:#f3f3f3;
  --orange:#f28c28;
  --white:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--light);color:var(--black);font-family:Arial,sans-serif}
header{background:var(--black);color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:800}
.logo span{color:var(--orange)}
main{max-width:650px;margin:28px auto;padding:0 15px}
.card{background:white;padding:24px;border-radius:5px;margin-bottom:18px}
h2{margin-top:0}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:4px;margin:8px 0 15px}
textarea{min-height:85px;resize:vertical}
.primary{background:var(--orange);color:var(--black);border:0;padding:14px;border-radius:4px;font-weight:bold;width:100%}
.secondary{background:var(--black);color:white;border:0;padding:10px 14px;border-radius:4px}
.google{background:white;border:1px solid #ccc;padding:14px;border-radius:4px;width:100%;font-weight:bold}
.hidden{display:none!important}
.muted{color:var(--grey);font-size:13px}
#message,#postMessage{margin-top:14px;font-size:14px}
.post{background:white;margin-bottom:18px;border-radius:5px;overflow:hidden}
.post img{width:100%;display:block}
.post-info{padding:15px}
.post-caption{margin-top:10px;white-space:pre-wrap}
footer{text-align:center;color:var(--grey);padding:25px;font-size:12px}
</style>
</head>
<body>

<header>
  <div class="logo">ChillSPot<span>.</span></div>
  <button id="logoutBtn" class="secondary hidden">Log out</button>
</header>

<main>

<section id="loginArea" class="card">
  <h2>Welcome to ChillSPot.</h2>
  <p class="muted">Your community. Your space.</p>
  <button id="googleBtn" class="google">Continue with Google</button>
  <div id="message"></div>
</section>

<section id="profileArea" class="card hidden">
  <h2>Create your profile.</h2>
  <p class="muted">Choose the name people will see on ChillSPot.</p>

  <label>Display name</label>
  <input id="displayName" placeholder="Your name">

  <label>Username</label>
  <input id="username" placeholder="Choose a username">

  <p class="muted">3–20 characters. Letters, numbers and underscores.</p>
  <button id="saveProfileBtn" class="primary">JOIN CHILLSPOT</button>
  <div id="profileMessage"></div>
</section>

<section id="appArea" class="hidden">

  <div class="card">
    <h2>Share a picture.</h2>
    <p class="muted">Share a moment with the community.</p>

    <label>Choose picture</label>
    <input id="file" type="file" accept="image/*">

    <label>Caption</label>
    <textarea id="caption" maxlength="1000" placeholder="Write something..."></textarea>

    <button id="postBtn" class="primary">PUBLISH POST</button>
    <div id="postMessage"></div>
  </div>

  <h2>Your feed</h2>
  <div id="feed">Loading posts...</div>

</section>
</main>

<footer>CHILLSPOT © 2026</footer>

<script>
const SUPABASE_URL = "https://ccbmsrehsufakvkzfwpc.supabase.co";
const SUPABASE_KEY = "sb_publishable_rWGMbKhFrMp0HZtp6hMQGQ_cjlhgqXX";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let currentUser = null;

function showMessage(id, text, error=false) {
  $(id).textContent = text;
  $(id).style.color = error ? "#c0392b" : "#333";
}

function showSection(section) {
  ["loginArea","profileArea","appArea"].forEach(id =>
    $(id).classList.toggle("hidden", id !== section)
  );
  $("logoutBtn").classList.toggle("hidden", section === "loginArea");
}

async function checkProfile(user) {
  currentUser = user;

  const {data, error} = await db
    .from("profiles")
    .select("id, username, display_name")
    .eq("id", user.id)
    .maybeSingle();

  if (error) {
    showSection("loginArea");
    showMessage("message", "Could not load profile: " + error.message, true);
    return;
  }

  if (!data) {
    $("displayName").value =
      user.user_metadata?.full_name ||
      user.user_metadata?.name || "";

    $("username").value = "";
    showMessage("profileMessage", "");
    showSection("profileArea");
    return;
  }

  showSection("appArea");
  await loadFeed();
}

$("googleBtn").onclick = async () => {
  $("googleBtn").disabled = true;
  showMessage("message", "Connecting to Google...");

  const {error} = await db.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: "https://brunomalikjunior.github.io/ChillSPot/"
    }
  });

  if (error) {
    showMessage("message", error.message, true);
    $("googleBtn").disabled = false;
  }
};

$("saveProfileBtn").onclick = async () => {
  if (!currentUser) return;

  const displayName = $("displayName").value.trim();
  const username = $("username").value.trim().toLowerCase();

  if (!displayName || !username) {
    return showMessage("profileMessage", "Complete both fields.", true);
  }

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    return showMessage(
      "profileMessage",
      "Username must be 3–20 characters using letters, numbers or underscores.",
      true
    );
  }

  $("saveProfileBtn").disabled = true;
  showMessage("profileMessage", "Saving your profile...");

  try {
    const {data: existing, error: checkError} = await db
      .from("profiles")
      .select("id")
      .eq("username", username)
      .maybeSingle();

    if (checkError) throw checkError;
    if (existing) throw new Error("That username is already taken.");

    const {error} = await db.from("profiles").insert({
      id: currentUser.id,
      username: username,
      display_name: displayName
    });

    if (error) throw error;

    showSection("appArea");
    await loadFeed();

  } catch (error) {
    showMessage("profileMessage", error.message, true);
  } finally {
    $("saveProfileBtn").disabled = false;
  }
};

$("logoutBtn").onclick = async () => {
  const {error} = await db.auth.signOut();

  if (error) {
    alert(error.message);
    return;
  }

  currentUser = null;
  showSection("loginArea");
  showMessage("message", "You have logged out.");
};

$("postBtn").onclick = async () => {
  const file = $("file").files[0];
  const caption = $("caption").value.trim();

  if (!file) {
    return showMessage("postMessage", "Choose a picture first.", true);
  }

  if (!file.type.startsWith("image/")) {
    return showMessage("postMessage", "Choose an image file.", true);
  }

  if (file.size > 5 * 1024 * 1024) {
    return showMessage("postMessage", "Image must be smaller than 5 MB.", true);
  }

  $("postBtn").disabled = true;
  showMessage("postMessage", "Uploading picture...");

  try {
    const {data: auth, error: authError} = await db.auth.getUser();
    if (authError) throw authError;
    if (!auth.user) throw new Error("Please log in again.");

    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = auth.user.id + "/" + Date.now() + "-" + safeName;

    const {error: uploadError} = await db.storage
      .from("post-images")
      .upload(path, file);

    if (uploadError) throw uploadError;

    const {data: imageData} = db.storage
      .from("post-images")
      .getPublicUrl(path);

    const {error: postError} = await db.from("posts").insert({
      user_id: auth.user.id,
      content: caption,
      image_url: imageData.publicUrl
    });

    if (postError) throw postError;

    $("file").value = "";
    $("caption").value = "";

    showMessage("postMessage", "Picture published!");
    await loadFeed();

  } catch (error) {
    showMessage("postMessage", error.message, true);
  } finally {
    $("postBtn").disabled = false;
  }
};

async function loadFeed() {
  $("feed").textContent = "Loading posts...";

  try {
    const {data: posts, error} = await db
      .from("posts")
      .select("id, user_id, content, image_url, created_at")
      .order("created_at", {ascending:false});

    if (error) throw error;

    if (!posts || posts.length === 0) {
      $("feed").textContent = "No posts yet. Be the first to share!";
      return;
    }

    const ids = [...new Set(posts.map(p => p.user_id))];

    const {data: profiles, error: profileError} = await db
      .from("profiles")
      .select("id, username, display_name")
      .in("id", ids);

    if (profileError) throw profileError;

    const profileMap = Object.fromEntries(
      (profiles || []).map(p => [p.id, p])
    );

    $("feed").innerHTML = "";

    posts.forEach(post => {
      const profile = profileMap[post.user_id] || {};

      const article = document.createElement("article");
      article.className = "post";

      const info = document.createElement("div");
      info.className = "post-info";

      const author = document.createElement("strong");
      author.textContent = profile.display_name || profile.username || "ChillSPot user";

      const handle = document.createElement("div");
      handle.className = "muted";
      handle.textContent = profile.username ? "@" + profile.username : "";

      const caption = document.createElement("div");
      caption.className = "post-caption";
      caption.textContent = post.content || "";

      const date = document.createElement("div");
      date.className = "muted";
      date.style.marginTop = "10px";
      date.textContent = post.created_at
        ? new Date(post.created_at).toLocaleString()
        : "";

      const image = document.createElement("img");
      image.src = post.image_url;
      image.alt = "Community picture";
      image.loading = "lazy";

      info.append(author, handle, caption, date);
      article.append(info, image);
      $("feed").appendChild(article);
    });

  } catch (error) {
    $("feed").textContent = "Could not load posts: " + error.message;
  }
}

async function start() {
  const {data, error} = await db.auth.getSession();

  if (error) {
    showSection("loginArea");
    showMessage("message", error.message, true);
    return;
  }

  if (data.session) {
    await checkProfile(data.session.user);
  } else {
    showSection("loginArea");
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_IN" && session?.user) {
    setTimeout(() => checkProfile(session.user), 0);
  }

  if (event === "SIGNED_OUT") {
    currentUser = null;
    showSection("loginArea");
  }
});

start();
</script>
</body>
</html>
